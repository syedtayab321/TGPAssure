[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgpassure"
version = "0.2.0"
description = "TGPAssure desktop quality-control and seismic visualization application"
requires-python = ">=3.13,<3.15"
dependencies = [
    "PySide6==6.11.1",
    "QtAwesome==1.4.2",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "pyqtgraph==0.14.0",
    "PyOpenGL==3.1.10",
    "reportlab==5.0.0",
    "openpyxl==3.1.5",
    "Pillow==12.3.0",
    "pyshp==3.1.4",
    "tifffile==2026.7.14",
    "ebcdic==2.0.1",
    "psutil==7.2.2",
    "matplotlib>=3.10,<4",
    "pyproj>=3.7,<4"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*", "ui*", "report*"]
namespaces = true
